name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: escape-raphael

jobs:
  build:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Godot export templates + editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          mkdir -v -p ~/.config
          mv /root/.config/godot ~/.config/godot || true

      - name: Install required Android SDK packages
        run: |
          # Godot 4.3's Android export template is hardcoded to expect
          # build-tools 33.0.2 and platform android-33 specifically - this
          # guarantees they're present under $ANDROID_HOME regardless of
          # what the base image happens to ship, instead of hoping it's
          # already there.
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platforms;android-33" "build-tools;33.0.2" || true

      - name: Diagnostics (only matters if the export step below still fails)
        run: |
          echo "---- HOME ----"
          echo "$HOME"
          echo "---- editor settings file present? ----"
          find ~/.config/godot -maxdepth 1 2>&1 || echo "NOT FOUND"
          echo "---- keystore present? ----"
          ls -la /tmp/debug.keystore 2>&1 || echo "NOT FOUND"
          echo "---- installed build-tools versions ----"
          ls -la /usr/lib/android-sdk/build-tools/ 2>&1 || echo "NOT FOUND"

      - name: Make output dir
        run: mkdir -v -p build/android

      - name: Import project (first pass so .godot cache exists)
        run: godot --headless --path . --import || true

      - name: Export debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          godot --headless --path . \
            --export-debug "Android" build/android/${EXPORT_NAME}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-debug-apk
          path: build/android/${{ env.EXPORT_NAME }}-debug.apk
