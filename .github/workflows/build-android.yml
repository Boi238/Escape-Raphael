name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: escape-raphael
  # The godot-ci image bakes these paths in as editor settings under
  # /root/.config, but GitHub Actions' container runner does not run
  # with HOME=/root, so Godot never sees that file (see the "Set up
  # Godot export templates + editor settings" step below, which is the
  # actual fix for that). These env vars are a second, independent path
  # to the same information - Godot's Android exporter falls back to
  # them when the editor-settings file lookup comes up empty, so between
  # the two fixes it doesn't matter which one Godot ends up using.
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  build:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create debug keystore
        run: |
          # Written to a fixed /tmp path (not ~/.android/...) on purpose:
          # /tmp doesn't depend on HOME resolving the way we expect, and
          # export_presets.cfg's keystore/debug field points at this
          # exact path, so the keystore config never depends on editor
          # settings being read correctly at all.
          keytool -genkey -v -keystore /tmp/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Godot export templates + editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          # Same problem, same fix, for the editor settings file: the
          # image bakes android_sdk_path/java_sdk_path/debug_keystore
          # into /root/.config/godot/editor_settings-4.3.tres, but that's
          # invisible to Godot unless it's under the HOME this container
          # actually runs with.
          mkdir -v -p ~/.config
          mv /root/.config/godot ~/.config/godot || true

      - name: Make output dir
        run: mkdir -v -p build/android

      - name: Import project (first pass so .godot cache exists)
        run: godot --headless --path . --import || true

      - name: Export debug APK
        run: |
          godot --headless --path . \
            --export-debug "Android" build/android/${EXPORT_NAME}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-debug-apk
          path: build/android/${{ env.EXPORT_NAME }}-debug.apk
