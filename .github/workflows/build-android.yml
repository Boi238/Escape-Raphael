name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: escape-raphael

jobs:
  build:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    # NOTE: GitHub Actions forces HOME=/github/home inside job containers and
    # ignores any HOME= you pass in (this is a known, permanent runner
    # behavior — see actions/runner#863, #1146, #1525 — not something a
    # workflow-level env var can override). The godot-ci image bakes its
    # Android SDK path, Java SDK path, and a debug keystore into editor
    # settings under /root/.config/godot at BUILD time, when HOME really was
    # /root. At RUN time HOME becomes /github/home, so Godot looks for that
    # config in the wrong place, finds nothing, and every Android-specific
    # check (build-tools, keystore, Java SDK) fails at once. The "Fix HOME
    # override" step below is the actual fix: copy the image's pre-baked
    # config into wherever $HOME points at runtime, then force-write the
    # exact values we know are true for this image/keystore, rather than
    # trust whatever happened to survive the copy.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Fix HOME override (editor settings, SDK paths, keystore)
        run: |
          mkdir -p ~/.config
          cp -r /root/.config/godot ~/.config/godot || mkdir -p ~/.config/godot

          SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION:0:3}.tres
          if [ ! -f "$SETTINGS" ]; then
            echo '[gd_resource type="EditorSettings" format=3]' > "$SETTINGS"
            echo '[resource]' >> "$SETTINGS"
          fi

          # Strip any stale/incorrect copies of these keys, then write the
          # values we know are correct for this exact image + our keystore,
          # instead of trusting whatever the copy brought over.
          sed -i '/^export\/android\/java_sdk_path/d;/^export\/android\/android_sdk_path/d;/^export\/android\/debug_keystore/d' "$SETTINGS"
          {
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >> "$SETTINGS"

          echo "---- resulting editor settings ----"
          cat "$SETTINGS"

      - name: Set up Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Make output dir
        run: mkdir -v -p build/android

      - name: Import project (first pass so .godot cache exists)
        run: godot --headless --path . --import || true

      - name: Export debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          godot --headless --path . \
            --export-debug "Android" build/android/${EXPORT_NAME}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-debug-apk
          path: build/android/${{ env.EXPORT_NAME }}-debug.apk
